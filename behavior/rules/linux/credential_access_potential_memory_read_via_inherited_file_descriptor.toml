[rule]
description = """
This rule detects utilities performing offset-based reads through inherited file descriptor paths. An attacker can open
"/proc/<pid>/mem" in a parent process and pass the descriptor to another utility through "/proc/self/fd" or "/dev/fd",
hiding the original process memory path from the reader's command line.
"""
id = "50bad595-6698-4794-a58f-f8fe5e3e9244"
license = "Elastic License v2"
name = "Potential Memory Read via Inherited File Descriptor"
os_list = ["linux"]
reference = [
    "https://man7.org/linux/man-pages/man5/proc_pid_fd.5.html",
    "https://man7.org/linux/man-pages/man5/proc_pid_mem.5.html",
]
version = "1.0.1"

query = '''
process where event.type == "start" and event.action == "exec" and
process.command_line like ("*/proc/self/fd/*", "*/dev/fd/*") and (
  (process.name == "dd" and process.args like "skip=*" and process.args like "count=*") or
  (process.name == "xxd" and process.args like ("-s*", "-seek*") and process.args like ("-l*", "-len*")) or
  (process.name == "hexdump" and process.args like ("-s*", "--skip*") and process.args like ("-n*", "--length*")) or
  (process.name == "od" and process.args like ("-j*", "--skip-bytes*") and process.args like ("-N*", "--read-bytes*")) or
  (process.name == "tail" and (
    (process.args in ("-c", "--bytes") and process.args like "+*") or
    process.args like ("-c+*", "--bytes=+*")
  ))
)
'''

min_endpoint_version = "7.15.0"
optional_actions = []
[[actions]]
action = "kill_process"
field = "process.entity_id"
state = 0

[[actions]]
action = "kill_process"
field = "process.parent.entity_id"
state = 0

[[threat]]
framework = "MITRE ATT&CK"
[[threat.technique]]
id = "T1003"
name = "OS Credential Dumping"
reference = "https://attack.mitre.org/techniques/T1003/"
[[threat.technique.subtechnique]]
id = "T1003.007"
name = "Proc Filesystem"
reference = "https://attack.mitre.org/techniques/T1003/007/"



[threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[internal]
min_endpoint_version = "7.15.0"
