[rule]
description = """
This rule detects PTRACE_POKEUSER requests targeting offsets associated with the x86-64 instruction pointer (RIP) or the
32-bit x86 instruction pointer (EIP). Modification of an instruction pointer through ptrace can redirect execution to
attacker-controlled code and may indicate process injection. Offset 48 may refer to a different register when the target
uses a native 64-bit register layout, so this rule is released as diagnostic.
"""
id = "953190e1-7c86-4a75-9f42-2d78d213291f"
license = "Elastic License v2"
name = "Potential Instruction Pointer Modification via Ptrace"
os_list = ["linux"]
reference = [
    "https://man7.org/linux/man-pages/man2/ptrace.2.html",
    "https://www.akamai.com/blog/security-research/the-definitive-guide-to-linux-process-injection",
]
version = "1.0.1"

query = '''
process where event.type == "start" and event.action == "ptrace" and process.Ext.ptrace.request == 6 and
process.Ext.ptrace.addr in (
  128, // RIP: x86-64
  48   // EIP: 32-bit x86; R11 with a native x86-64 register layout
)
'''

min_endpoint_version = "9.1.4"
optional_actions = []
[[actions]]
action = "kill_process"
field = "process.entity_id"
state = 0

[[actions]]
action = "kill_process"
field = "process.parent.entity_id"
state = 0

[[threat]]
framework = "MITRE ATT&CK"
[[threat.technique]]
id = "T1055"
name = "Process Injection"
reference = "https://attack.mitre.org/techniques/T1055/"
[[threat.technique.subtechnique]]
id = "T1055.008"
name = "Ptrace System Calls"
reference = "https://attack.mitre.org/techniques/T1055/008/"



[threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"

[internal]
min_endpoint_version = "9.1.4"
