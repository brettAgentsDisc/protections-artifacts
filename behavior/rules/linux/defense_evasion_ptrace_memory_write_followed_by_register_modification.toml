[rule]
description = """
This rule detects a process using ptrace to write to another process's memory before modifying the register state of the
same target. This sequence is commonly used to place code in a remote process and redirect its execution, and may
indicate process injection.
"""
id = "719490d3-a828-464f-b9e2-82b72b7fbd4b"
license = "Elastic License v2"
name = "Ptrace Memory Write Followed by Register Modification"
os_list = ["linux"]
reference = [
    "https://man7.org/linux/man-pages/man2/ptrace.2.html",
    "https://www.akamai.com/blog/security-research/the-definitive-guide-to-linux-process-injection",
]
version = "1.0.3"

query = '''
sequence by process.entity_id, process.Ext.ptrace.child_pid with maxspan=2s
  [process where event.type == "start" and event.action == "ptrace" and
   process.Ext.ptrace.request in (4, 5) and process.Ext.ptrace.addr > 4096 and
   process.executable != null and not process.executable like (
     "/opt/dynatrace/oneagent/agent/lib64/oneagenthelper", "/opt/scorec/toolworks/totalview.*/bin/tvdsvrmain_mrnet",
     "/usr/libexec/platform-python*", "/usr/libexec/gdb", "/home/*/.var/app/com.usebottles.bottles/data/bottles/runners/*/bin/wineserver",
     "/usr/imperva/ragent/bin/InjectionManager", "/usr/bin/reptyr"
   )]
  [process where event.type == "start" and event.action == "ptrace" and
   process.Ext.ptrace.request in (6, 13, 16901)]
'''

min_endpoint_version = "9.1.4"
optional_actions = []
[[actions]]
action = "kill_process"
field = "process.entity_id"
state = 0

[[actions]]
action = "kill_process"
field = "process.entity_id"
state = 1

[[actions]]
action = "kill_process"
field = "process.parent.entity_id"
state = 0

[[actions]]
action = "kill_process"
field = "process.parent.entity_id"
state = 1

[[threat]]
framework = "MITRE ATT&CK"
[[threat.technique]]
id = "T1055"
name = "Process Injection"
reference = "https://attack.mitre.org/techniques/T1055/"
[[threat.technique.subtechnique]]
id = "T1055.008"
name = "Ptrace System Calls"
reference = "https://attack.mitre.org/techniques/T1055/008/"



[threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"

[internal]
min_endpoint_version = "9.1.4"
