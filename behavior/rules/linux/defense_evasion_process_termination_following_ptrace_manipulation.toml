[rule]
description = """
This rule detects a process terminating shortly after its memory and register state were modified through ptrace.
Immediate termination following ptrace manipulation can indicate an unsuccessful process-injection attempt, invalid
shellcode, or execution-flow corruption.
"""
id = "ee3e4e2b-6f2a-473f-b51c-60c7e29664ef"
license = "Elastic License v2"
name = "Process Termination Following Ptrace Manipulation"
os_list = ["linux"]
reference = [
    "https://man7.org/linux/man-pages/man2/ptrace.2.html",
    "https://www.akamai.com/blog/security-research/the-definitive-guide-to-linux-process-injection",
]
version = "1.0.3"

query = '''
sequence with maxspan=1s
  [process where event.type == "start" and event.action == "ptrace" and
   process.Ext.ptrace.request in (4, 5) and
   process.Ext.ptrace.addr >= 4096 and process.executable != null and
   not process.executable in (
     "/opt/dynatrace/oneagent/agent/lib64/oneagenthelper", "/usr/libexec/gdb"
   )] by process.Ext.ptrace.child_pid
  [process where event.type == "start" and event.action == "ptrace" and
   process.Ext.ptrace.request in (6, 13, 16901)] by process.Ext.ptrace.child_pid
  [process where event.type == "end" and event.action == "end"] by process.pid
'''

min_endpoint_version = "9.1.4"
optional_actions = []
[[actions]]
action = "kill_process"
field = "process.entity_id"
state = 0

[[actions]]
action = "kill_process"
field = "process.entity_id"
state = 1

[[actions]]
action = "kill_process"
field = "process.parent.entity_id"
state = 0

[[actions]]
action = "kill_process"
field = "process.parent.entity_id"
state = 1

[[threat]]
framework = "MITRE ATT&CK"
[[threat.technique]]
id = "T1055"
name = "Process Injection"
reference = "https://attack.mitre.org/techniques/T1055/"
[[threat.technique.subtechnique]]
id = "T1055.008"
name = "Ptrace System Calls"
reference = "https://attack.mitre.org/techniques/T1055/008/"



[threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"

[internal]
min_endpoint_version = "9.1.4"
